<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Spect-IT</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-container {
            text-align: center;
            padding: 60px 20px;
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 1.5rem;
            color: #666;
            margin-bottom: 30px;
        }
        .home-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s ease;
        }
        .home-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👁️ Spect-IT</h1>
            <p class="subtitle">Professional Vision Testing Tools</p>
        </header>
        
        <main>
            <div class="error-container">
                <div class="error-code">404</div>
                <h2 class="error-message">Page Not Found</h2>
                <p style="color: #999; margin-bottom: 30px;">
                    The page you're looking for doesn't exist or has been moved.
                </p>
                <a href="/" class="home-btn">Go to Home</a>
            </div>
        </main>
        
        <footer>
            <p>Spect-IT © 2025 | For informational purposes only</p>
        </footer>
    </div>
</body>
</html>
