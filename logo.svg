<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Main eye gradient -->
    <linearGradient id="eyeMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    
    <!-- Iris gradient with depth -->
    <radialGradient id="irisGrad" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="30%" style="stop-color:#a8c0ff;stop-opacity:0.8" />
      <stop offset="60%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:1" />
    </radialGradient>
    
    <!-- Pupil gradient -->
    <radialGradient id="pupilGrad" cx="45%" cy="45%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    
    <!-- Eyelid shadow -->
    <linearGradient id="eyelidShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#764ba2;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft shadow -->
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <circle cx="150" cy="150" r="140" fill="url(#eyeMainGrad)" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Main eye shape (almond) -->
  <path d="M 60 150 
           Q 60 90, 150 90 
           Q 240 90, 240 150 
           Q 240 210, 150 210 
           Q 60 210, 60 150" 
        fill="url(#eyeMainGrad)" 
        stroke="#ffffff" 
        stroke-width="3"
        filter="url(#softShadow)"/>
  
  <!-- Upper eyelid with depth -->
  <path d="M 60 150 
           Q 60 90, 150 90 
           Q 240 90, 240 150" 
        fill="url(#eyelidShadow)" 
        stroke="none"/>
  
  <path d="M 60 150 
           Q 60 90, 150 90 
           Q 240 90, 240 150" 
        fill="none" 
        stroke="#764ba2" 
        stroke-width="4"
        stroke-linecap="round"
        opacity="0.7"/>
  
  <!-- Iris outer ring -->
  <circle cx="150" cy="150" r="55" fill="url(#irisGrad)" opacity="0.95"/>
  
  <!-- Iris texture rings -->
  <circle cx="150" cy="150" r="55" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
  <circle cx="150" cy="150" r="48" fill="none" stroke="#a8c0ff" stroke-width="1" opacity="0.3"/>
  <circle cx="150" cy="150" r="42" fill="none" stroke="#667eea" stroke-width="1" opacity="0.4"/>
  
  <!-- Iris radial lines for detail -->
  <g opacity="0.15">
    <line x1="150" y1="150" x2="150" y2="95" stroke="#4a5568" stroke-width="1"/>
    <line x1="150" y1="150" x2="150" y2="205" stroke="#4a5568" stroke-width="1"/>
    <line x1="150" y1="150" x2="95" y2="150" stroke="#4a5568" stroke-width="1"/>
    <line x1="150" y1="150" x2="205" y2="150" stroke="#4a5568" stroke-width="1"/>
    <line x1="150" y1="150" x2="118" y2="118" stroke="#4a5568" stroke-width="1"/>
    <line x1="150" y1="150" x2="182" y2="182" stroke="#4a5568" stroke-width="1"/>
    <line x1="150" y1="150" x2="182" y2="118" stroke="#4a5568" stroke-width="1"/>
    <line x1="150" y1="150" x2="118" y2="182" stroke="#4a5568" stroke-width="1"/>
  </g>
  
  <!-- Pupil -->
  <circle cx="150" cy="150" r="28" fill="url(#pupilGrad)"/>
  <circle cx="150" cy="150" r="28" fill="none" stroke="#000000" stroke-width="1" opacity="0.5"/>
  
  <!-- Main highlight (large) -->
  <ellipse cx="142" cy="142" rx="12" ry="16" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="142" cy="142" rx="8" ry="12" fill="#ffffff" opacity="0.95"/>
  
  <!-- Secondary highlight (small) -->
  <ellipse cx="158" cy="158" rx="6" ry="8" fill="#ffffff" opacity="0.6"/>
  
  <!-- Reflection sparkle -->
  <circle cx="145" cy="145" r="3" fill="#ffffff" opacity="1"/>
  <circle cx="155" cy="155" r="2" fill="#ffffff" opacity="0.8"/>
  
  <!-- Top eyelashes (detailed) -->
  <g stroke="#764ba2" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 70 110 Q 68 105, 66 100" opacity="0.8"/>
    <path d="M 85 100 Q 83 95, 81 90" opacity="0.9"/>
    <path d="M 100 95 Q 98 90, 96 85" opacity="1"/>
    <path d="M 115 93 Q 113 88, 111 83" opacity="1"/>
    <path d="M 130 92 Q 128 87, 126 82" opacity="1"/>
    <path d="M 145 91 Q 143 86, 141 81" opacity="1"/>
    <path d="M 160 92 Q 162 87, 164 82" opacity="1"/>
    <path d="M 175 93 Q 177 88, 179 83" opacity="1"/>
    <path d="M 190 95 Q 192 90, 194 85" opacity="1"/>
    <path d="M 205 100 Q 207 95, 209 90" opacity="0.9"/>
    <path d="M 220 110 Q 222 105, 224 100" opacity="0.8"/>
  </g>
  
  <!-- Bottom eyelashes (subtle) -->
  <g stroke="#667eea" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 80 190 Q 82 195, 84 200"/>
    <path d="M 100 195 Q 102 200, 104 205"/>
    <path d="M 120 198 Q 122 203, 124 208"/>
    <path d="M 140 199 Q 142 204, 144 209"/>
    <path d="M 160 199 Q 158 204, 156 209"/>
    <path d="M 180 198 Q 178 203, 176 208"/>
    <path d="M 200 195 Q 198 200, 196 205"/>
    <path d="M 220 190 Q 218 195, 216 200"/>
  </g>
  
  <!-- Lower eyelid -->
  <path d="M 60 150 
           Q 60 210, 150 210 
           Q 240 210, 240 150" 
        fill="none" 
        stroke="#667eea" 
        stroke-width="2.5"
        opacity="0.5"/>
  
  <!-- Inner corner highlight -->
  <ellipse cx="75" cy="150" rx="8" ry="12" fill="#ffffff" opacity="0.3"/>
  
  <!-- Outer corner detail -->
  <path d="M 225 150 Q 230 145, 235 140" 
        stroke="#764ba2" 
        stroke-width="2" 
        fill="none" 
        opacity="0.4"/>
</svg>
