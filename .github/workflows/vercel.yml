name: Vercel Deployment Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify required files exist
        run: |
          echo "Checking required files..."
          test -f index.html || (echo "❌ index.html missing" && exit 1)
          test -f config.js || (echo "❌ config.js missing" && exit 1)
          test -f app.js || (echo "❌ app.js missing" && exit 1)
          test -f vercel.json || (echo "❌ vercel.json missing" && exit 1)
          echo "✅ All required files present"

      - name: Validate vercel.json
        run: |
          echo "Validating vercel.json..."
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))" || (echo "❌ vercel.json is invalid JSON" && exit 1)
          echo "✅ vercel.json is valid"

      - name: Check for Supabase configuration
        run: |
          echo "Checking Supabase configuration..."
          if grep -q "SUPABASE_URL" config.js && grep -q "SUPABASE_ANON_KEY" config.js; then
            echo "✅ Supabase configuration found"
          else
            echo "⚠️ Supabase configuration not found in config.js"
          fi

      - name: Validate HTML structure
        run: |
          echo "Validating HTML structure..."
          if grep -q "<!DOCTYPE html>" index.html && grep -q "</html>" index.html; then
            echo "✅ HTML structure valid"
          else
            echo "❌ HTML structure invalid" && exit 1
          fi

      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - spect-it-app1: validate
          status: ${{ job.status }}
          description: GitHub Actions validation checks

  notify-vercel:
    name: Notify Vercel of Status
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    
    steps:
      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - spect-it-app1: validate
          status: ${{ needs.validate.result }}
          description: All validation checks completed

