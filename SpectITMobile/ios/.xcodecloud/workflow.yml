# Xcode Cloud Workflow Configuration
# This file defines the workflow for automated builds

name: Build and Distribute Spect-IT
scheme: SpectIT
configuration: Release
destination: generic/platform=iOS
team_id: UHMT4AX5T7
bundle_id: com.spectit.app

# Build actions
actions:
  - archive
  - distribute

# Triggers
triggers:
  - type: git_push
    branch: main
  - type: manual

