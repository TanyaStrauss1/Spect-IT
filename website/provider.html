<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spect-IT — Practice Console</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo-icon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: #f3f1ec; color: #0f1419; }
  header { background: linear-gradient(135deg,#0c1524,#1e3a5f); color: #fff; padding: 1.25rem 1.5rem; display: flex; align-items: center; gap: .75rem; border-bottom: 1px solid rgba(201,169,98,.25); }
  header .mark { width: 40px; height: 40px; border-radius: 10px; background: rgba(201,169,98,.15); border: 1px solid rgba(201,169,98,.35); display: grid; place-items: center; font-size: 1.3rem; }
  header h1 { font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; font-weight: 600; }
  header .env { margin-left: auto; font-size: .8rem; opacity: .85; letter-spacing: .04em; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
  .bar { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.25rem; }
  .bar input, .bar select { padding: .6rem .8rem; border: 1px solid #e5e0d8; border-radius: 10px; font: inherit; background: #fff; }
  .bar input { flex: 1; min-width: 200px; }
  .btn { padding: .6rem 1.1rem; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font: inherit; letter-spacing: .02em; }
  .btn.primary { background: linear-gradient(135deg,#a8864a,#c9a962); color: #152a45; border: 1px solid rgba(168,134,74,.25); }
  .btn.ghost { background: #fff; border: 1px solid #e5e0d8; color: #1e2936; }
  .status-line { font-size: .85rem; color: #5c6570; margin-bottom: 1rem; }
  .card { background: #fff; border: 1px solid #e5e0d8; border-radius: 16px; padding: 1.1rem 1.25rem; margin-bottom: .9rem; box-shadow: 0 1px 2px rgba(15,20,25,.05); }
  .card .top { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: flex-start; }
  .card h3 { font-size: 1.1rem; font-family: 'Cormorant Garamond', serif; font-weight: 600; }
  .muted { color: #5c6570; font-size: .9rem; }
  .badge { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: .25rem .6rem; border-radius: 999px; }
  .b-requested { background: #faf6ee; color: #8a6d2f; border: 1px solid rgba(201,169,98,.3); }
  .b-confirmed { background: #eef5f0; color: #2d5a45; }
  .b-declined, .b-cancelled { background: #faf0f0; color: #8b4040; }
  .b-completed { background: #eef2f6; color: #1e3a5f; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: .5rem 1.5rem; margin: .8rem 0; }
  .grid div span { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: #94a3b8; }
  .grid div strong { font-size: .95rem; }
  .actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; }
  .actions button { font-size: .85rem; padding: .45rem .9rem; }
  .results { margin-top: .6rem; font-size: .85rem; }
  details summary { cursor: pointer; color: #a8864a; font-weight: 600; }
  pre { background: #faf9f7; border: 1px solid #e5e0d8; border-radius: 10px; padding: .75rem; overflow: auto; font-size: .78rem; margin-top: .5rem; }
  .empty { text-align: center; color: #5c6570; padding: 3rem 1rem; }
  .note { background: #faf6ee; border: 1px solid rgba(201,169,98,.35); color: #8a6d2f; border-radius: 12px; padding: .8rem 1rem; font-size: .85rem; margin-bottom: 1.25rem; }
  .login-panel { max-width: 400px; margin: 3rem auto; background: #fff; border: 1px solid #e5e0d8; border-radius: 16px; padding: 2rem; box-shadow: 0 8px 28px rgba(15,20,25,.08); }
  .login-panel h2 { font-family: 'Cormorant Garamond', serif; margin-bottom: .5rem; }
  .login-panel input { width: 100%; padding: .65rem .8rem; border: 1px solid #e5e0d8; border-radius: 10px; margin: .5rem 0 1rem; font: inherit; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <div class="mark">👁️</div>
    <h1>Spect-IT — Practice Console</h1>
    <span class="env" id="env">connecting…</span>
  </header>
  <div class="wrap">
    <div id="login-panel" class="login-panel">
      <h2>Practice access</h2>
      <p class="muted" style="margin-bottom:1rem">Enter your practice access code to view appointment requests.</p>
      <label class="muted" for="pin">Access code</label>
      <input id="pin" type="password" placeholder="Provided by Spect-IT" autocomplete="current-password">
      <label class="muted" for="practiceId">Practice ID (optional)</label>
      <input id="practiceId" type="text" placeholder="Google place_id filter">
      <button class="btn primary" style="width:100%" onclick="login()">Sign in</button>
      <p class="muted" id="login-err" style="margin-top:.75rem;color:#8b4040"></p>
    </div>
    <div id="console-panel" class="hidden">
    <div class="note">Protected by access code. Set <code>SPECTIT_PROVIDER_PIN</code> in Supabase secrets. For production, add per-practice Supabase Auth accounts.</div>
    <div class="bar">
      <input id="q" type="text" placeholder="Filter by practice or patient name…" oninput="render()">
      <select id="statusFilter" onchange="render()">
        <option value="">All statuses</option>
        <option value="requested">Requested</option>
        <option value="confirmed">Confirmed</option>
        <option value="declined">Declined</option>
        <option value="cancelled">Cancelled</option>
        <option value="completed">Completed</option>
      </select>
      <button class="btn primary" onclick="load()">Refresh</button>
    </div>
    <div class="status-line" id="statusLine"></div>
    <div id="list"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    let ALL = [];
    const AUTH_KEY = 'spectit_provider_token';

    function isAuthed() {
      return !!sessionStorage.getItem(AUTH_KEY);
    }

    function showConsole() {
      document.getElementById('login-panel').classList.add('hidden');
      document.getElementById('console-panel').classList.remove('hidden');
    }

    async function login() {
      const pin = document.getElementById('pin').value;
      const practiceId = document.getElementById('practiceId').value.trim();
      const err = document.getElementById('login-err');
      err.textContent = '';
      if (!pin) { err.textContent = 'Enter your access code.'; return; }
      try {
        if (!window.SupabaseStorage || !window.SupabaseStorage.invoke) {
          err.textContent = 'Practice console requires a live Supabase connection.';
          return;
        }
        const { data, error } = await window.SupabaseStorage.invoke('provider-auth', { pin, practiceId });
        if (error || !data || !data.success) {
          err.textContent = (data && data.error) || 'Invalid access code.';
          return;
        }
        if (!data.token) {
          err.textContent = 'Could not establish a secure session.';
          return;
        }
        sessionStorage.setItem(AUTH_KEY, data.token);
        if (practiceId) sessionStorage.setItem('spectit_practice_filter', practiceId);
        showConsole();
        load();
      } catch (e) {
        err.textContent = 'Could not verify access code.';
      }
    }

    async function providerCall(body) {
      const token = sessionStorage.getItem(AUTH_KEY);
      if (!token) throw new Error('Not signed in');
      const { data, error } = await window.SupabaseStorage.invoke('provider-api', Object.assign({ token: token }, body));
      if (error) throw error;
      if (!data || data.error) throw new Error(data.error || 'Provider API error');
      return data;
    }

    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
    function fmtWhen(d,t){ try { return new Date(d+'T'+(t||'09:00')).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+' · '+t; } catch(e){ return d+' '+t; } }

    async function load() {
      const sl = document.getElementById('statusLine');
      if (!(window.SupabaseStorage && window.SupabaseStorage.isAvailable())) {
        document.getElementById('env').textContent = 'offline (no Supabase)';
        sl.textContent = 'Supabase is not connected in this browser. Deploy the appointments table and confirm credentials.';
        ALL = []; render(); return;
      }
      document.getElementById('env').textContent = 'connected';
      sl.textContent = 'Loading appointments…';
      try {
        const placeId = sessionStorage.getItem('spectit_practice_filter') || '';
        const result = await providerCall({ action: 'list', practicePlaceId: placeId || undefined });
        ALL = result.appointments || [];
        sl.textContent = ALL.length + ' appointment(s) in the database.';
      } catch (e) {
        sl.textContent = 'Could not load appointments (has the SQL table been created?).';
        ALL = [];
      }
      render();
    }

    function resultsSummary(r) {
      if (!r) return '';
      const keys = Object.keys(r);
      if (!keys.length) return '';
      let rx = r.prescription;
      let head = rx ? ('Rx: ' + (rx.summary || (rx.sphere||'') )) : (keys.length + ' test result(s)');
      return '<div class="results"><details><summary>Attached Spect-IT results — ' + esc(head) + '</summary><pre>' + esc(JSON.stringify(r, null, 2)) + '</pre></details></div>';
    }

    function render() {
      const q = (document.getElementById('q').value || '').toLowerCase();
      const sf = document.getElementById('statusFilter').value;
      const list = document.getElementById('list');
      let rows = ALL.filter(function (a) {
        const hay = ((a.practice_name||'') + ' ' + (a.patient_name||'') + ' ' + (a.user_email||'')).toLowerCase();
        return (!q || hay.indexOf(q) !== -1) && (!sf || a.status === sf);
      });
      if (!rows.length) { list.innerHTML = '<div class="empty">No appointments to show.</div>'; return; }
      list.innerHTML = rows.map(function (a) {
        const st = a.status || 'requested';
        return '<div class="card">' +
          '<div class="top"><div><h3>' + esc(a.patient_name || 'Patient') + '</h3>' +
          '<div class="muted">' + esc(a.service_label || a.service || '') + ' · ' + esc(fmtWhen(a.appt_date, a.appt_time)) + '</div></div>' +
          '<span class="badge b-' + esc(st) + '">' + esc(st) + '</span></div>' +
          '<div class="grid">' +
            '<div><span>Practice</span><strong>' + esc(a.practice_name || '—') + '</strong></div>' +
            '<div><span>Patient email</span><strong>' + esc(a.user_email || '—') + '</strong></div>' +
            '<div><span>Patient phone</span><strong>' + esc(a.patient_phone || '—') + '</strong></div>' +
            '<div><span>Practice address</span><strong>' + esc(a.practice_address || '—') + '</strong></div>' +
          '</div>' +
          (a.patient_notes ? '<div class="muted">📝 ' + esc(a.patient_notes) + '</div>' : '') +
          resultsSummary(a.results) +
          '<div class="actions">' +
            (st !== 'confirmed' ? '<button class="btn primary" onclick="setStatus(\'' + esc(a.appt_id) + '\',\'confirmed\')">Confirm</button>' : '') +
            (st !== 'declined' ? '<button class="btn ghost" onclick="setStatus(\'' + esc(a.appt_id) + '\',\'declined\')">Decline</button>' : '') +
            (st !== 'completed' ? '<button class="btn ghost" onclick="setStatus(\'' + esc(a.appt_id) + '\',\'completed\')">Mark completed</button>' : '') +
          '</div>' +
        '</div>';
      }).join('');
    }

    async function setStatus(apptId, status) {
      try {
        await providerCall({ action: 'setStatus', apptId: apptId, status: status });
        ALL = ALL.map(function (a) { return a.appt_id === apptId ? Object.assign({}, a, { status: status }) : a; });
        var row = ALL.find(function (a) { return a.appt_id === apptId; });
        if (row && window.SupabaseStorage.invoke) {
          var email = row.user_email;
          var when = fmtWhen(row.appt_date, row.appt_time);
          if (email && (status === 'confirmed' || status === 'declined')) {
            window.SupabaseStorage.invoke('send-email', {
              to: email,
              subject: 'Appointment ' + status + ' — ' + (row.practice_name || 'your practice'),
              text: 'Hi ' + (row.patient_name || '') + ',\n\nYour appointment request for ' + when + ' has been ' + status + '.\n\nPractice: ' + (row.practice_name || '') + '\n\n— Spect-IT'
            }).catch(function () {});
          }
        }
        render();
      } catch (e) { alert('Could not update status.'); }
    }

    window.addEventListener('load', function () {
      setTimeout(function () {
        if (isAuthed()) { showConsole(); load(); }
        else { document.getElementById('env').textContent = 'sign in required'; }
      }, 400);
    });
  </script>
</body>
</html>
