<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="iconIris" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Eye shape -->
  <path d="M 25 50 Q 25 25, 50 25 Q 75 25, 75 50 Q 75 75, 50 75 Q 25 75, 25 50" 
        fill="url(#iconGradient)"/>
  
  <!-- Iris -->
  <circle cx="50" cy="50" r="18" fill="url(#iconIris)"/>
  
  <!-- Pupil -->
  <circle cx="50" cy="50" r="10" fill="#000000"/>
  
  <!-- Highlight -->
  <ellipse cx="48" cy="48" rx="4" ry="5" fill="#ffffff" opacity="0.9"/>
</svg>

